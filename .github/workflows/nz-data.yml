# Holt jeden Tag die neuseeländischen Bergbau-Daten (NZ Petroleum & Minerals) und speichert sie in data/nz/.
# Gibt es Änderungen, werden sie automatisch hochgeladen – die App zeigt dann den neuen Stand.
name: NZ-Daten aktualisieren
on:
  schedule:
    - cron: "17 14 * * *"     # täglich (14:17 UTC)
  workflow_dispatch: {}        # auch von Hand startbar (GitHub → Actions)
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/update_nz.py
      - name: Änderungen hochladen
        run: |
          git config user.name "MAUSIBOX Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nz
          if git diff --cached --quiet -- data/nz/*.geojson; then echo "keine Änderungen"; exit 0; fi
          git commit -m "NZ-Daten aktualisiert"
          git push
