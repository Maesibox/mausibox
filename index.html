<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d1a14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MAUSIBOX App</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="lib/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <div id="topbar"><span id="app-title"></span><span class="offline-badge">OFFLINE</span></div>

  <div id="buttons">
    <button id="btn-layers" data-label="layers">
      <svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5Zm-8.2 9L2 13l10 5 10-5-1.8-1L12 16l-8.2-4Zm0 4L2 17l10 5 10-5-1.8-1L12 20l-8.2-4Z"/></svg>
    </button>
    <button id="btn-gps" data-label="gps">
      <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 3h-2.1A7 7 0 0 0 13 5.1V3h-2v2.1A7 7 0 0 0 5.1 11H3v2h2.1a7 7 0 0 0 5.9 5.9V21h2v-2.1a7 7 0 0 0 5.9-5.9H21v-2Zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/></svg>
    </button>
    <button id="btn-add" data-label="addPoint" class="big">
      <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
    </button>
    <button id="btn-track" data-label="track">
      <svg viewBox="0 0 24 24"><path d="M4 18c2.5 0 3-3 5-3s2.5 3 5 3 3-6 6-6v-2c-4 0-4.5 6-6 6s-2-3-5-3-3.5 3-5 3v2Zm2-11a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm12 3a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/></svg>
    </button>
    <button id="btn-park" data-label="parking" class="park-btn">P</button>
    <button id="btn-list" data-label="points">
      <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
    </button>
    <button id="btn-menu" data-label="menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    </button>
  </div>

  <div id="rec"></div>
  <div id="status"></div>
  <div id="toast"></div>

  <div id="gate"><div class="gate-box"></div></div>

  <div id="sheet">
    <div class="sheet-head"><span class="sheet-title"></span><button class="sheet-close" aria-label="Close"></button></div>
    <div class="sheet-body"></div>
  </div>

  <script src="lib/leaflet.js"></script>
  <script src="lib/supabase.js"></script>
  <script src="lib/qrcode.js"></script>
  <script src="config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/points.js"></script>
  <script src="js/exportimport.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/coords.js"></script>
  <script src="js/claims.js"></script>
  <script src="js/tracks.js"></script>
  <script src="js/parking.js"></script>
  <script src="js/help.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script>
    // Zuerst anmelden (falls ein Server eingetragen ist), dann die Karte starten
    Auth.init().then(function () { App.init(); });
  </script>
</body>
</html>
